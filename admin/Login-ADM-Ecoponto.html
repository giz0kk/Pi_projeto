<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="../" data-app-base>
  <script>(function(){var p=location.pathname.replace(/\\/g,"/"),b=document.querySelector("base[data-app-base]"),m=p.match(/^(.*\/)(?:auth|admin|pages|mapa)\/[^/]+$/);if(b)b.href=m?m[1]:p.replace(/\/[^/]*$/,"/")||"/";})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login ADM EcoPontos | EcoColeta</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin/Login-ADM-Ecoponto.css?v=4">
  <link rel="stylesheet" href="ecocheck-dist/ecocheck.css?v=5">
  <link rel="stylesheet" href="assets/css/ecocheck-widget.css?v=10">
  <script src="assets/js/ecocoleta-paths.js?v=2"></script>
  <script src="assets/js/ecocheck-bridge.js?v=10"></script>
  <script defer src="ecocheck-dist/ecocheck.iife.js?v=5"></script>
</head>
<body>
  <div class="eco-bg-scene" aria-hidden="true">
    <span class="eco-bg-icon eco-bg-icon--1"></span>
    <span class="eco-bg-icon eco-bg-icon--2"></span>
    <span class="eco-bg-icon eco-bg-icon--3"></span>
    <span class="eco-bg-icon eco-bg-icon--4"></span>
    <span class="eco-bg-icon eco-bg-icon--5"></span>
    <span class="eco-bg-icon eco-bg-icon--6"></span>
    <span class="eco-bg-icon eco-bg-icon--7"></span>
    <span class="eco-bg-icon eco-bg-icon--8"></span>
    <span class="eco-bg-icon eco-bg-icon--9"></span>
    <span class="eco-bg-icon eco-bg-icon--10"></span>
    <span class="eco-bg-icon eco-bg-icon--11"></span>
    <span class="eco-bg-icon eco-bg-icon--12"></span>
    <span class="eco-bg-icon eco-bg-icon--13"></span>
    <span class="eco-bg-icon eco-bg-icon--14"></span>
  </div>
  <main class="admin-login">
    <section class="login-card" aria-label="Formulário de login administrativo">
      <a href="pages/tela-inicia.html" class="login-brand">
        <img src="assets/images/logo.2.png" alt="EcoColeta">
      </a>
      <div class="login-heading">
        <h2>Portal ADM EcoPonto</h2>
        <p>Entre com sua credencial de administrador para acessar o painel do ponto parceiro.</p>
      </div>

      <form id="adminLoginForm" novalidate>
        <label class="form-field" for="adminEmail">
          <span>E-mail do administrador</span>
          <input id="adminEmail" name="email" type="email" placeholder="admin.ecoponto@ecocoleta.local" autocomplete="email" required>
          <small id="adminEmailError"></small>
        </label>

        <label class="form-field" for="adminPassword">
          <span>Senha</span>
          <div class="password-wrap">
            <input id="adminPassword" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button type="button" id="toggleAdminPassword" aria-label="Mostrar senha">👁</button>
          </div>
          <small id="adminPasswordError"></small>
        </label>

        <div class="ecocheck-widget">
          <button type="button" class="ecocheck-trigger is-idle" data-ecocheck-open aria-label="Abrir verificação EcoCheck">
            <span class="ecocheck-trigger__main">
              <span class="ecocheck-trigger__icon" data-ecocheck-icon aria-hidden="true">
                <svg class="ecocheck-icon ecocheck-icon--loading" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <circle cx="12" cy="12" r="8.5" stroke="#c5d9cc" stroke-width="2.5"/>
                  <path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5" stroke="#12895d" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <svg class="ecocheck-icon ecocheck-icon--verified" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path class="ecocheck-check-path" d="M7.2 12.3l2.8 2.7 6.8-7" stroke="#0f6b38" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="ecocheck-trigger__label">Não sou um robô</span>
            </span>
            <span class="ecocheck-trigger__brand" aria-hidden="true">
              <span class="ecocheck-trigger__brand-name">EcoCheck</span>
              <span class="ecocheck-trigger__brand-tag">ANTI-BOT</span>
            </span>
          </button>
        </div>

        <p id="adminFormError" class="admin-form-error" role="alert" hidden data-ecocheck-form-error></p>

        <button type="submit" class="submit-btn">
          <span>Acessar painel premium</span>
        </button>
      </form>

      <div class="demo-access">
        <strong>Credencial inicial local</strong>
        <span>E-mail: admin.ecoponto@ecocoleta.local</span>
        <span>Senha: EcoPonto@123</span>
      </div>

    </section>
  </main>

  <script>
    const form = document.getElementById('adminLoginForm');
    const emailInput = document.getElementById('adminEmail');
    const passwordInput = document.getElementById('adminPassword');
    const emailError = document.getElementById('adminEmailError');
    const passwordError = document.getElementById('adminPasswordError');
    const formError = document.getElementById('adminFormError');

    function clearErrors() {
      [emailInput, passwordInput].forEach((input) => input.classList.remove('input-error'));
      emailError.textContent = '';
      passwordError.textContent = '';
      if (formError) {
        formError.textContent = '';
        formError.hidden = true;
      }
    }

    function showFormError(message) {
      if (!formError) return;
      formError.textContent = message;
      formError.hidden = !message;
    }

    function parseJsonServidor(text) {
      const raw = String(text || '').replace(/^\uFEFF/, '').trim();
      if (!raw) return {};
      try {
        return JSON.parse(raw);
      } catch (e) {
        const idx = raw.indexOf('{"');
        if (idx >= 0) return JSON.parse(raw.slice(idx));
        throw e;
      }
    }

    async function postAdminLogin(email, senha, ecocheckToken) {
      if (typeof window.ecocoletaPhpUrl !== 'function') {
        throw new Error('Recurso de caminhos não carregou (ecocoleta-paths.js). Recarregue a página.');
      }
      const endpoint = window.ecocoletaPhpUrl('Login-ADM-Ecoponto.php');
      if (!endpoint) {
        throw new Error('Abra esta página pelo servidor (http://localhost/...), não como arquivo local.');
      }

      let response;
      try {
        response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body: new URLSearchParams({ email, senha, ecocheck_token: ecocheckToken || '' }).toString(),
          credentials: 'same-origin',
          cache: 'no-store',
        });
      } catch (e) {
        throw new Error('Não foi possível falar com o servidor. Verifique se o Apache e o MySQL estão ligados no XAMPP.');
      }

      const text = await response.text();
      let data;
      try {
        data = parseJsonServidor(text);
      } catch (e) {
        if (!response.ok) {
          throw new Error('O servidor respondeu com erro ' + response.status + '. Verifique o caminho do projeto e os logs do PHP.');
        }
        throw new Error('Resposta inesperada do servidor (não-JSON). Verifique os logs do PHP.');
      }

      if (!response.ok && !(data && data.erro)) {
        throw new Error('O servidor respondeu com erro ' + response.status + '.');
      }
      return data;
    }

    document.getElementById('toggleAdminPassword').addEventListener('click', () => {
      const visible = passwordInput.type === 'text';
      passwordInput.type = visible ? 'password' : 'text';
      document.getElementById('toggleAdminPassword').setAttribute('aria-label', visible ? 'Mostrar senha' : 'Ocultar senha');
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearErrors();

      const email = emailInput.value.trim();
      const senha = passwordInput.value;
      let valid = true;

      if (!email) {
        emailInput.classList.add('input-error');
        emailError.textContent = 'Digite o e-mail administrativo.';
        valid = false;
      }
      if (!senha) {
        passwordInput.classList.add('input-error');
        passwordError.textContent = 'Digite a senha.';
        valid = false;
      }
      if (!valid) return;

      let ecocheckToken = '';
      if (window.EcoCheck && typeof window.EcoCheck.ensureVerified === 'function') {
        const verified = await window.EcoCheck.ensureVerified();
        if (!verified.ok) {
          showFormError(verified.erro || 'Conclua a verificação EcoCheck.');
          if (window.EcoCheckBridge) window.EcoCheckBridge.updateStatus();
          return;
        }
        ecocheckToken = verified.token || window.EcoCheck.getToken() || '';
      } else {
        showFormError('EcoCheck não carregou. Execute ecocheck/build.bat.');
        return;
      }

      const button = form.querySelector('.submit-btn');
      button.disabled = true;
      button.textContent = 'Validando...';

      try {
        const data = await postAdminLogin(email, senha, ecocheckToken);
        if (data && data.sucesso === true && data.admin) {
          localStorage.setItem('ecopontoAdminLoggedIn', 'true');
          localStorage.setItem('ecopontoAdminName', data.admin.nome || '');
          localStorage.setItem('ecopontoAdminEmail', data.admin.email || '');
          localStorage.setItem('ecopontoAdminPoint', data.admin.ecoponto || '');
          window.location.replace('admin/Home-ADM-Ecoponto.html');
          return;
        }
        showFormError((data && data.erro) ? data.erro : 'Não foi possível acessar o painel.');
      } catch (error) {
        showFormError((error && error.message) ? error.message : 'Verifique se o Apache e o MySQL estão ligados no XAMPP.');
      } finally {
        button.disabled = false;
        button.textContent = 'Acessar painel';
      }
    });

    (async function redirecionarSeJaLogado() {
      try {
        const response = await fetch(window.ecocoletaPhpUrl('admin-ecoponto-session.php'), {
          method: 'GET',
          credentials: 'same-origin',
          cache: 'no-store',
        });
        const data = parseJsonServidor(await response.text());
        if (data && data.sucesso === true && data.admin) {
          window.location.replace('admin/Home-ADM-Ecoponto.html');
        }
      } catch (e) {
        /* permanece na tela de login */
      }
    })();
  </script>
</body>
</html>
