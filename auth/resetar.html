<!DOCTYPE html>
<html lang="pt-br">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <title>Redefinir Senha</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<img src="assets/images/logo.2.png" class="logo" alt="EcoColeta">

<div class="container">
  <h2>Nova Senha</h2>

  <div class="password-field">
    <input type="password" id="senha" placeholder="Nova senha" autocomplete="new-password">
    <button type="button" class="password-toggle" data-password-toggle-for="senha"></button>
  </div>
  <div class="password-field">
    <input type="password" id="confirmar" placeholder="Confirme a senha" autocomplete="new-password">
    <button type="button" class="password-toggle" data-password-toggle-for="confirmar"></button>
  </div>

  <button class="btn-verde" onclick="resetarSenha()">Redefinir Senha</button>
</div>

<script>
let token = "";

// pega o token automaticamente da URL
window.onload = function() {
    let params = new URLSearchParams(window.location.search);
    token = params.get("token");

    if (!token) {
        alert("Token inválido ou não informado!");
        window.location.href = "auth/login.html";
    }
};

function resetarSenha() {
    let senha = document.getElementById("senha").value;
    let confirmar = document.getElementById("confirmar").value;

    if (!senha || !confirmar) {
        alert("Preencha todos os campos!");
        return;
    }

    if (senha !== confirmar) {
        alert("As senhas não coincidem!");
        return;
    }

    fetch(new URL("../resetar_senha.php", window.location.href).href, {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `token=${token}&senha=${senha}`
    })
    .then(res => res.json())
    .then(data => {
        if (data.sucesso) {
            alert("Senha redefinida com sucesso!");
            window.location.href = "auth/login.html";
        } else {
            alert(data.erro);
        }
    })
    .catch(error => {
        alert("Erro ao conectar com o servidor");
        console.log(error);
    });
}
</script>
<script src="assets/js/password-toggle.js"></script>

</body>
</html>
