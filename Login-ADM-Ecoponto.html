<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login ADM EcoPontos | EcoColeta</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Login-ADM-Ecoponto.css">
</head>
<body>
  <main class="admin-login">
    <section class="login-card" aria-label="Formulário de login administrativo">
      <a href="tela-inicia.html" class="login-brand">
        <img src="Imagens/logo.2.png" alt="EcoColeta">
      </a>
      <div class="login-heading">
        <h2>Portal ADM EcoPonto</h2>
        <p>Entre com sua credencial de administrador para acessar o painel do ponto parceiro.</p>
      </div>

      <form id="adminLoginForm" novalidate>
        <label class="form-field" for="adminEmail">
          <span>E-mail do administrador</span>
          <input id="adminEmail" name="email" type="email" placeholder="admin.ecoponto@ecocoleta.local" autocomplete="email" required>
          <small id="adminEmailError"></small>
        </label>

        <label class="form-field" for="adminPassword">
          <span>Senha</span>
          <div class="password-wrap">
            <input id="adminPassword" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button type="button" id="toggleAdminPassword" aria-label="Mostrar senha">👁</button>
          </div>
          <small id="adminPasswordError"></small>
        </label>

        <button type="submit" class="submit-btn">
          <span>Acessar painel premium</span>
        </button>
      </form>

      <div class="demo-access">
        <strong>Credencial inicial local</strong>
        <span>E-mail: admin.ecoponto@ecocoleta.local</span>
        <span>Senha: EcoPonto@123</span>
      </div>

    </section>
  </main>

  <div class="admin-modal hidden" id="adminLoginModal" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
    <div class="admin-modal-card">
      <button type="button" class="admin-modal-close" aria-label="Fechar">&times;</button>
      <span class="modal-badge">EcoPonto ADM</span>
      <h3 id="adminModalTitle">Atenção</h3>
      <p id="adminModalMessage"></p>
      <button type="button" id="adminModalAction">Fechar</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('adminLoginForm');
    const emailInput = document.getElementById('adminEmail');
    const passwordInput = document.getElementById('adminPassword');
    const emailError = document.getElementById('adminEmailError');
    const passwordError = document.getElementById('adminPasswordError');
    const modal = document.getElementById('adminLoginModal');
    const modalTitle = document.getElementById('adminModalTitle');
    const modalMessage = document.getElementById('adminModalMessage');
    const modalAction = document.getElementById('adminModalAction');
    let loginOk = false;

    function clearErrors() {
      [emailInput, passwordInput].forEach((input) => input.classList.remove('input-error'));
      emailError.textContent = '';
      passwordError.textContent = '';
    }

    function showModal(title, message, success) {
      loginOk = success === true;
      modalTitle.textContent = title;
      modalMessage.textContent = message;
      modalAction.textContent = loginOk ? 'Ir para o painel' : 'Fechar';
      modal.classList.remove('hidden');
    }

    function closeModal() {
      modal.classList.add('hidden');
    }

    function parseJsonServidor(text) {
      const raw = String(text || '').replace(/^\uFEFF/, '').trim();
      if (!raw) return {};
      try {
        return JSON.parse(raw);
      } catch (e) {
        const idx = raw.indexOf('{"');
        if (idx >= 0) return JSON.parse(raw.slice(idx));
        throw e;
      }
    }

    async function postAdminLogin(email, senha) {
      const response = await fetch('Login-ADM-Ecoponto.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: new URLSearchParams({ email, senha }).toString(),
        credentials: 'same-origin',
        cache: 'no-store',
      });
      const text = await response.text();
      return parseJsonServidor(text);
    }

    document.getElementById('toggleAdminPassword').addEventListener('click', () => {
      const visible = passwordInput.type === 'text';
      passwordInput.type = visible ? 'password' : 'text';
      document.getElementById('toggleAdminPassword').setAttribute('aria-label', visible ? 'Mostrar senha' : 'Ocultar senha');
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearErrors();

      const email = emailInput.value.trim();
      const senha = passwordInput.value;
      let valid = true;

      if (!email) {
        emailInput.classList.add('input-error');
        emailError.textContent = 'Digite o e-mail administrativo.';
        valid = false;
      }
      if (!senha) {
        passwordInput.classList.add('input-error');
        passwordError.textContent = 'Digite a senha.';
        valid = false;
      }
      if (!valid) return;

      const button = form.querySelector('.submit-btn');
      button.disabled = true;
      button.textContent = 'Validando...';

      try {
        const data = await postAdminLogin(email, senha);
        if (data && data.sucesso === true && data.admin) {
          localStorage.setItem('ecopontoAdminLoggedIn', 'true');
          localStorage.setItem('ecopontoAdminName', data.admin.nome || '');
          localStorage.setItem('ecopontoAdminEmail', data.admin.email || '');
          localStorage.setItem('ecopontoAdminPoint', data.admin.ecoponto || '');
          showModal('Login realizado', data.mensagem || 'Acesso autorizado.', true);
        } else {
          showModal('Atenção', (data && data.erro) ? data.erro : 'Não foi possível acessar o painel.', false);
        }
      } catch (error) {
        showModal('Erro de conexão', 'Verifique se o Apache e o MySQL estão ligados no XAMPP.', false);
      } finally {
        button.disabled = false;
        button.textContent = 'Acessar painel';
      }
    });

    modalAction.addEventListener('click', () => {
      if (loginOk) {
        window.location.replace('Home-ADM-Ecoponto.html');
      } else {
        closeModal();
      }
    });

    modal.querySelector('.admin-modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', (event) => {
      if (event.target === modal) closeModal();
    });

    (async function redirecionarSeJaLogado() {
      try {
        const response = await fetch('admin-ecoponto-session.php', {
          method: 'GET',
          credentials: 'same-origin',
          cache: 'no-store',
        });
        const data = parseJsonServidor(await response.text());
        if (data && data.sucesso === true && data.admin) {
          window.location.replace('Home-ADM-Ecoponto.html');
        }
      } catch (e) {
        /* permanece na tela de login */
      }
    })();
  </script>
</body>
</html>
