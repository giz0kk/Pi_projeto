<!DOCTYPE html>
<html lang="pt-br" class="auth-view">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Login - EcoColeta</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="premios.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="notif-popup.css">
  <link rel="stylesheet" href="anti-bot.css">
  <script defer src="anti-bot.js"></script>
  <style>
    .auth .container {
      background: rgba(255, 255, 255, 0.98);
      padding: 40px 32px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      margin: 0 auto;
      display: block;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
    }

    .auth .container h2 {
      font-size: 28px;
      font-weight: 700;
      color: #1E3A8A;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .auth .container .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 32px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1E3A8A;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .auth input {
      width: 100%;
      padding: 14px 16px;
      margin: 0;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      outline: none;
      font-size: 15px;
      font-family: 'Sora', sans-serif;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.8);
    }

    .auth input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .auth input:focus {
      border-color: #2E7D32;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
    }

    .auth input:hover:not(:focus) {
      border-color: #cbd5e1;
    }

    .auth input.input-error {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.02);
    }

    .auth input.input-error:focus {
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
    }

    .field-error {
      color: #ef4444;
      font-size: 12px;
      margin-top: 6px;
      text-align: left;
      display: block;
      min-height: 18px;
      font-weight: 500;
    }

    .form-actions {
      margin-top: 24px;
      margin-bottom: 20px;
    }

    .link {
      color: #2E7D32;
      font-size: 13px;
      text-align: right;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .link:hover {
      color: #1B5E20;
      text-decoration: underline;
    }

    button:not(.password-toggle) {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      margin-top: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 15px;
      letter-spacing: 0.3px;
    }

    button:not(.password-toggle):hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(46, 125, 50, 0.2);
    }

    button:not(.password-toggle):active {
      transform: translateY(0);
    }

    .password-field {
      position: relative;
      width: 100%;
    }

    /* Especificidade: vence `button { width:100% }` do próprio arquivo */
    button.password-toggle {
      width: 44px !important;
      min-width: 44px !important;
      max-width: 44px !important;
      height: 44px !important;
      margin: 0 !important;
      margin-top: 0 !important;
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      padding: 0 !important;
      background: transparent !important;
      border: none !important;
      color: #1E3A8A !important;
      border-radius: 10px !important;
      cursor: pointer;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      box-shadow: none !important;
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
    }

    button.password-toggle:hover {
      transform: translateY(-50%) !important;
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
    }

    button.password-toggle:active {
      transform: translateY(-50%) !important;
    }

    button.password-toggle .pwt-fallback {
      display: none;
      font-size: 18px;
      line-height: 1;
    }

    button.password-toggle .pwt-svg-open,
    button.password-toggle .pwt-svg-shut {
      display: block;
      width: 22px;
      height: 22px;
    }

    button.password-toggle .pwt-svg-open path,
    button.password-toggle .pwt-svg-open circle,
    button.password-toggle .pwt-svg-shut path,
    button.password-toggle .pwt-svg-shut line {
      stroke: currentColor !important;
      fill: none !important;
    }

    button.password-toggle .pwt-svg-shut {
      display: none;
    }

    button.password-toggle.is-visible .pwt-svg-open {
      display: none;
    }

    button.password-toggle.is-visible .pwt-svg-shut {
      display: block;
    }

    .auth .password-field input {
      padding-right: 48px !important;
    }

    .btn-verde {
      background: linear-gradient(135deg, #8FFFC7 0%, #7fd9b5 100%);
      color: #0f2c21;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(143, 255, 199, 0.3);
    }

    .btn-verde:hover {
      box-shadow: 0 8px 25px rgba(143, 255, 199, 0.4);
    }

    .btn-borda {
      background: linear-gradient(135deg, #8FFFC7 0%, #7fd9b5 100%);
      border: 1.5px solid #e2e8f0;
      color: #0f2c21;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.9);
      color: #1E3A8A;
      border: 1.5px solid #cbd5e1;
    }

    .btn-borda:hover {
      background: rgba(255, 255, 255, 1);
      border-color: #2E7D32;
      color: #2E7D32;
      box-shadow: 0 4px 15px rgba(46, 125, 50, 0.1);
    }

    .auth .logo-container {
      margin-bottom: 20px;
    }

    .auth .logo-container img {
      width: 140px;
      height: auto;
      object-fit: contain;
    }

    .login-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .login-modal-overlay.active {
      display: flex;
    }

    .login-modal {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
      text-align: left;
      animation: slideUp 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 16px;
    }

    .login-modal-header h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: #1E3A8A;
      letter-spacing: -0.3px;
    }

    .close-login-modal {
      background: transparent;
      border: none;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.2s ease;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-login-modal:hover {
      color: #1E3A8A;
      background: rgba(30, 58, 138, 0.05);
      border-radius: 8px;
    }

    .login-modal p {
      color: #475569;
      margin: 0 0 24px 0;
      line-height: 1.6;
      font-size: 15px;
    }

    #continueLogin {
      margin-top: 0;
    }

    @media (max-width: 480px) {
      .auth .container {
        padding: 32px 24px;
        max-width: 100%;
      }

      .auth .container h2 {
        font-size: 24px;
      }

      button:not(.password-toggle) {
        padding: 13px 16px;
        font-size: 14px;
      }

      button.password-toggle {
        width: 44px !important;
        height: 44px !important;
        min-width: 44px !important;
        padding: 0 !important;
      }

      .auth input {
        padding: 13px 16px;
        font-size: 14px;
      }

      .login-modal {
        padding: 24px;
      }

      .login-modal-header h3 {
        font-size: 18px;
      }
    }

    /* =========================================================
       Ajustes finais de layout da tela de login:
       - card nao e mais cortado por overflow:hidden do style.css
       - logo / card vertical e horizontalmente alinhados
       - "Esqueceu a senha?" alinhado a direita
       - espacamentos proporcionais dentro do card
       ========================================================= */
    html.auth-view,
    html:has(body.auth) {
      height: auto;
      max-height: none;
      overflow: auto;
    }

    body.auth.login {
      height: auto;
      min-height: 100vh;
      max-height: none;
      overflow-y: auto;
      padding: 28px 16px;
      gap: 12px;
      justify-content: center;
    }

    body.auth.login > .logo-container {
      margin: 0 0 4px;
      display: flex;
      justify-content: center;
    }

    body.auth.login .logo-container img {
      width: 120px;
      max-width: 120px;
      max-height: 80px;
    }

    body.auth.login > .container {
      max-height: none;
      overflow: visible;
      display: block;
      width: 100%;
      max-width: 420px;
      padding: 30px 32px 28px;
    }

    body.auth.login .container h2 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    body.auth.login .container .subtitle {
      margin-bottom: 22px;
    }

    body.auth.login .form-group {
      margin-bottom: 12px;
    }

    body.auth.login .form-group + .form-group {
      margin-bottom: 4px;
    }

    body.auth.login .field-error:empty {
      min-height: 0;
      margin-top: 0;
    }

    body.auth.login .form-actions {
      margin: 4px 0 14px;
      text-align: right;
    }

    body.auth.login .form-actions .link {
      text-align: right;
      display: inline-block;
      margin: 0;
    }

    body.auth.login .container > button:not(.password-toggle) {
      margin-top: 8px;
    }

    body.auth.login .container > button:not(.password-toggle) + button:not(.password-toggle) {
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      body.auth.login {
        padding: 20px 14px;
      }

      body.auth.login > .container {
        padding: 26px 22px 24px;
      }

      body.auth.login .logo-container img {
        width: 100px;
        max-height: 70px;
      }
    }
  </style>
</head>

<body class="auth login">

  <div class="auth logo-container">
    <img src="Imagens/logo telas.png" alt="EcoColeta Logo">
  </div>

  <div class="container">
    <h2>Bem-vindo ao <span class="verde">EcoColeta</span></h2>
    <p class="subtitle">Faça login para continuar</p>
    <p id="cadastroOkHint" style="display:none; color:#1B5E20; font-size:14px; font-weight:600; margin:-12px 0 18px;"></p>

    <div class="form-group">
      <label for="loginEmail">E-mail</label>
      <input id="loginEmail" type="email" placeholder="seu@email.com">
      <span class="field-error" id="emailError"></span>
    </div>

    <div class="form-group">
      <label for="loginPassword">Senha</label>
      <div class="password-field">
        <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="password-toggle" onclick="ecocoletaToggleSenha(this,'loginPassword')" aria-label="Mostrar senha" title="Mostrar senha">
          <svg class="pwt-svg-open" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3" stroke="#64748b" stroke-width="2"/></svg>
          <svg class="pwt-svg-shut" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23" stroke="#64748b" stroke-width="2"/></svg>
          <span class="pwt-fallback" aria-hidden="true">👁</span>
        </button>
      </div>
      <span class="field-error" id="passwordError"></span>
    </div>

    <div class="form-actions">
      <p class="link" onclick="window.location.href='recuperar.html'">
        Esqueceu a senha?
      </p>
    </div>

    <div class="eco-antibot" data-eco-antibot>
      <button type="button" class="eco-antibot-btn" role="checkbox" aria-checked="false" aria-label='Marcar "Nao sou um robo"'>
        <span class="eco-antibot-box" aria-hidden="true">
          <span class="eco-antibot-spinner"></span>
          <svg class="eco-antibot-check" viewBox="0 0 20 20"><polyline points="4 11 8 15 16 6"></polyline></svg>
        </span>
        <span class="eco-antibot-label">Não sou um robô</span>
      </button>
      <div class="eco-antibot-brand" aria-hidden="true">
        <span class="eco-antibot-brand-title">EcoCheck</span>
        <span class="eco-antibot-brand-sub">Anti-bot</span>
      </div>
    </div>

    <button class="btn-verde" type="button" onclick="login()">Entrar</button>

    <button class="btn-borda" type="button"
      onclick="window.location.href='cadastro.html'">
      Criar conta
    </button>
  </div>

  <div class="login-modal-overlay" id="loginModal">
    <div class="login-modal">
      <div class="login-modal-header">
        <h3>Atenção</h3>
        <button class="close-login-modal" type="button" aria-label="Fechar">&times;</button>
      </div>
      <p id="loginModalMessage">Login realizado com sucesso!</p>
      <button class="btn-verde" id="continueLogin" type="button">Continuar</button>
    </div>
  </div>

  <script>
    function ecocoletaToggleSenha(btn, inputId) {
      var inp = document.getElementById(inputId);
      if (!inp || !btn) return;
      var visible = inp.type !== 'password';
      if (visible) {
        inp.type = 'password';
        btn.classList.remove('is-visible');
        btn.setAttribute('aria-label', 'Mostrar senha');
        btn.setAttribute('title', 'Mostrar senha');
      } else {
        inp.type = 'text';
        btn.classList.add('is-visible');
        btn.setAttribute('aria-label', 'Ocultar senha');
        btn.setAttribute('title', 'Ocultar senha');
      }
    }

    function showError(inputId, errorId, message) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(errorId);
      if (input) input.classList.add('input-error');
      if (error) error.textContent = message;
    }

    function clearErrors() {
      ['loginEmail', 'loginPassword'].forEach((id) => {
        const input = document.getElementById(id);
        if (input) input.classList.remove('input-error');
      });
      ['emailError', 'passwordError'].forEach((id) => {
        const error = document.getElementById(id);
        if (error) error.textContent = '';
      });
    }

    let loginTeveSucesso = false;

    function showLoginModal(message, titulo) {
      const loginModal = document.getElementById('loginModal');
      const modalMessage = document.getElementById('loginModalMessage');
      const modalTitle = loginModal ? loginModal.querySelector('.login-modal-header h3') : null;
      const btnContinue = document.getElementById('continueLogin');
      if (modalMessage) modalMessage.textContent = message;
      if (modalTitle) modalTitle.textContent = titulo || 'Atenção';
      if (btnContinue) btnContinue.textContent = loginTeveSucesso ? 'Continuar' : 'Fechar';
      if (loginModal) loginModal.classList.add('active');
    }

    function closeLoginModal() {
      const modal = document.getElementById('loginModal');
      if (modal) modal.classList.remove('active');
    }

    function obterUrlServidor(arquivoPhp) {
      if (window.location.protocol === 'file:') {
        return null;
      }
      return new URL(arquivoPhp, window.location.href).href;
    }

    function parseJsonServidor(text) {
      const raw = String(text || '').replace(/^\uFEFF/, '').trim();
      if (!raw) return {};
      try {
        return JSON.parse(raw);
      } catch (e1) {
        const marcas = ['{"sucesso"', '{"erro"', '{"detalhe"', '{"usuario"', '{"mensagem"'];
        let idx = -1;
        for (const m of marcas) {
          const i = raw.indexOf(m);
          if (i >= 0 && (idx < 0 || i < idx)) idx = i;
        }
        if (idx < 0) throw e1;
        let depth = 0;
        for (let i = idx; i < raw.length; i++) {
          const c = raw[i];
          if (c === '{') depth++;
          else if (c === '}') {
            depth--;
            if (depth === 0) return JSON.parse(raw.slice(idx, i + 1));
          }
        }
        throw e1;
      }
    }

    async function postFormJson(arquivoPhp, campos) {
      const url = obterUrlServidor(arquivoPhp);
      if (!url) {
        throw new Error('FILE_PROTOCOL');
      }
      const body = new URLSearchParams(campos);
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: body.toString(),
        credentials: 'same-origin',
        cache: 'no-store',
      });
      const text = await res.text();
      let data;
      try {
        data = parseJsonServidor(text);
      } catch (e) {
        const limpo = text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 350);
        throw new Error('BAD_RESPONSE:' + (limpo || ('HTTP ' + res.status)));
      }
      return { res, data };
    }

    async function login() {
      clearErrors();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      let valid = true;
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!email) {
        showError('loginEmail', 'emailError', 'Digite um e-mail.');
        valid = false;
      } else if (!emailPattern.test(email)) {
        showError('loginEmail', 'emailError', 'Digite um e-mail válido.');
        valid = false;
      }

      if (!password) {
        showError('loginPassword', 'passwordError', 'Digite sua senha.');
        valid = false;
      }

      if (!valid) {
        return;
      }

      const antibot = (window.EcoAntiBot && window.EcoAntiBot.validate)
        ? window.EcoAntiBot.validate()
        : { ok: true };
      if (!antibot.ok) {
        showLoginModal(antibot.erro || 'Falha na verificação anti-bot.', 'Atenção');
        return;
      }

      loginTeveSucesso = false;
      try {
        const { res, data } = await postFormJson('login.php', {
          email: email,
          senha: password,
        });

        const temErro = data && Object.prototype.hasOwnProperty.call(data, 'erro') && data.erro != null && data.erro !== '';
        const uid = data.usuario && data.usuario.id;
        const okUsuario = data.usuario && typeof data.usuario === 'object'
          && (typeof uid === 'number' || (typeof uid === 'string' && uid !== ''))
          && typeof data.usuario.email === 'string';

        const aceito = data.sucesso === true && !temErro && okUsuario;

        if (aceito) {
          loginTeveSucesso = true;
          localStorage.setItem('loggedIn', 'true');
          localStorage.setItem('userId', String(data.usuario.id));
          localStorage.setItem('userName', data.usuario.nome);
          localStorage.setItem('userEmail', data.usuario.email);
          showLoginModal(data.mensagem || 'Login realizado com sucesso!', 'Sucesso');
        } else {
          localStorage.removeItem('loggedIn');
          localStorage.removeItem('userId');
          localStorage.removeItem('userName');
          localStorage.removeItem('userEmail');
          showLoginModal(
            (data && data.erro) ? data.erro : 'Não foi possível fazer login. (' + res.status + ')',
            'Atenção'
          );
        }
      } catch (e) {
        if (e && e.message === 'FILE_PROTOCOL') {
          showLoginModal('Abra pelo servidor: INICIAR-PROJETO.bat ou http://localhost/projeto_pi/login.html (nao use file://).', 'Atenção');
          return;
        }
        if (e && String(e.message).startsWith('BAD_RESPONSE:')) {
          showLoginModal('Servidor não devolveu JSON. Ligue Apache/MySQL no XAMPP. ' + e.message.replace('BAD_RESPONSE:', ''), 'Atenção');
          return;
        }
        showLoginModal('Sem conexão com o servidor. Verifique se o Apache está ligado e o endereço é http://localhost/projeto_pi/', 'Atenção');
      }
    }

    const loginModal = document.getElementById('loginModal');
    if (loginModal) {
      const closeButtons = loginModal.querySelectorAll('.close-login-modal, #continueLogin');
      closeButtons.forEach((button) => {
        button.addEventListener('click', () => {
          if (button.id === 'continueLogin') {
            if (loginTeveSucesso) {
              const params = new URLSearchParams(window.location.search);
              const redirect = params.get('redirect');
              window.location.href = redirect && !/^https?:\/\//i.test(redirect) ? redirect : 'tela-inicia.html';
            } else {
              closeLoginModal();
            }
          } else {
            closeLoginModal();
          }
        });
      });

      loginModal.addEventListener('click', (event) => {
        if (event.target === loginModal) {
          closeLoginModal();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const prefilledEmail = params.get('email');
      const emailInput = document.getElementById('loginEmail');
      if (prefilledEmail && emailInput) {
        emailInput.value = prefilledEmail;
      }
      if (params.get('registered') === '1') {
        const hint = document.getElementById('cadastroOkHint');
        if (hint) {
          hint.style.display = 'block';
          hint.textContent = 'Conta criada com sucesso! Entre com seu e-mail e senha.';
        }
      }
    });
  </script>
</body>
</html>
